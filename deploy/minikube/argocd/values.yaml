# Release argocd, namespace argocd, chart argo-cd 10.10.5: minikube-infrastructure/argocd.tf (Terraform).
# Served at https://jithendar.com/argocd: the gateway terminates TLS and routes /argocd (deploy/minikube/istio/edge,
# delegate argocd/argocd) to the VirtualService below; do not strip /argocd from upstream requests.
fullnameOverride: argocd
configs:
  cm:
    url: https://jithendar.com/argocd
    admin.enabled: true
    users.anonymous.enabled: false
  params:
    server.insecure: true
    server.rootpath: /argocd
    server.basehref: /argocd
    # Argo CD's database on the shared Valkey: ACL user argocd may open only this one (redis.tf, local.argocd_redis).
    redis.db: "7"
  rbac:
    policy.default: ''
server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}

# No Redis of its own: Argo CD's cache is on the shared Valkey in namespace redis (minikube-infrastructure/redis.tf),
# through valkey-master (HAProxy to the current primary, so failovers keep the address), Istio mTLS on the way.
# Every key Argo CD writes has a TTL, so maxmemory-policy volatile-lru may evict it; Argo CD then recomputes it.
redis:
  enabled: false
redis-ha:
  enabled: false
externalRedis:
  host: valkey-master.redis.svc.cluster.local
  port: 6379
  # redis-username and redis-password of ACL user argocd, written by argocd.tf.
  existingSecret: argocd-redis-valkey

dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false

extraObjects:
  # /argocd on the Istio gateway: a delegate of the jithendar.com routing table (deploy/minikube/istio/edge). Argo CD
  # serves under /argocd itself (server.rootpath, server.basehref) in plain HTTP (server.insecure). HTTP to HTTPS is the
  # Gateway's own redirect.
  - apiVersion: networking.istio.io/v1
    kind: VirtualService
    metadata:
      name: argocd
      namespace: argocd
    spec:
      http:
        # Cloudflare caches by URL alone (cookies and Accept ignored), and gives what it keeps max-age=3600. It also
        # rewrote the page for Rocket Loader (main.*.js left to its loader script): where that loader did not run, the
        # UI never started, a blank page. no-transform on every answer makes Cloudflare pass Argo CD's bytes as sent.
        #
        # The API answers GETs without Cache-Control: one signed-out /api/v1/session/userinfo sent every reload back to
        # the login page, and a signed-in /api/v1/clusters was served to anyone. no-store keeps every answer out of
        # Cloudflare and the browser cache.
        - name: argocd-api
          match:
            - uri: {prefix: /argocd/api/}
          headers:
            response:
              set: {cache-control: 'no-store, no-transform'}
          route:
            - destination:
                host: argocd-server.argocd.svc.cluster.local
                port: {number: 80}
        # The UI's pages (/argocd/, /argocd/applications, ...): Argo CD answers each two ways. A request that accepts
        # text/html gets index.html with <base href="/argocd/"> and Cache-Control no-cache, private; any other (curl, a
        # probe: Accept */*) gets the file as built (<base href="/">, so main.*.js loads from / and 404s: a blank page)
        # or a 404, both cacheable, and Cloudflare then served that to browsers. With Accept forced every page is the
        # rewritten, uncacheable one; files (a "." in the path) are served as before, whatever the Accept.
        - name: argocd
          headers:
            request:
              set: {accept: text/html}
            response:
              add: {cache-control: no-transform}
          route:
            - destination:
                host: argocd-server.argocd.svc.cluster.local
                port: {number: 80}
  # The UI shares the jithendar.com origin, so its localStorage, with the site and every other tool under it. Argo CD's
  # main.js starts with JSON.parse(localStorage.getItem("theme")) || "light", and Open WebUI (/chat) stores a bare
  # word under that key: "system" on its first load, and light, dark, oled-dark or her from its theme picker. JSON.parse
  # threw on that ('"system" is not valid JSON') and the UI never started, a blank page (2026-11-28; the site's own
  # theme had done the same on 2026-11-19 and moved to site-theme). Argo CD only reads the key, never writes it.
  #
  # A Lua filter in argocd-server's sidecar (inbound, the server port) adds a script to Argo CD's page, before
  # main.js runs (deferred), that makes localStorage.getItem("theme") answer null when the stored value is not JSON:
  # Argo CD then starts in its default theme, and Open WebUI's value stays as it is. Every page load asks Argo CD for
  # an uncompressed page (it gzips otherwise), so the script can go in; the gateway compresses the page on the way
  # out (istio/edge, values compression). The chart passes extraObjects through tpl: no template braces in here.
  - apiVersion: networking.istio.io/v1alpha3
    kind: EnvoyFilter
    metadata:
      name: argocd-theme-guard
      namespace: argocd
    spec:
      workloadSelector:
        labels:
          app.kubernetes.io/name: argocd-server
          app.kubernetes.io/instance: argocd
      configPatches:
        - applyTo: HTTP_FILTER
          match:
            context: SIDECAR_INBOUND
            listener:
              # argocd-server's container port (--port=8080; the Service's targetPort for 80 and 443).
              portNumber: 8080
              filterChain:
                filter:
                  name: envoy.filters.network.http_connection_manager
                  subFilter:
                    name: envoy.filters.http.router
          patch:
            operation: INSERT_BEFORE
            value:
              name: argocd.theme-guard
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                default_source_code:
                  inline_string: |
                    -- The browser part: getItem("theme") on localStorage answers null for a value JSON.parse
                    -- cannot read; every other key, every other storage and setItem are untouched. Patched on the
                    -- prototype: assigning localStorage.getItem would store an item named "getItem" instead.
                    local SCRIPT = [==[<script>(function () {
                      var getItem = Storage.prototype.getItem;
                      Storage.prototype.getItem = function (key) {
                        var value = getItem.apply(this, arguments);
                        if (key !== "theme" || value === null || this !== window.localStorage) return value;
                        try {
                          JSON.parse(value);
                          return value;
                        } catch (e) {
                          return null;
                        }
                      };
                    })();</script>]==]

                    -- A page load (not a file or an API call). Browsers say so in Sec-Fetch-Dest. Without it (curl)
                    -- go by the path: the VirtualService sets Accept to text/html on everything but the API, so
                    -- Accept tells nothing here. Not the API, and no "." in the last segment (main.*.js, assets/...).
                    local function is_page(headers)
                      local dest = headers:get("sec-fetch-dest")
                      if dest ~= nil then
                        return dest == "document"
                      end
                      local path = string.gsub(headers:get(":path") or "", "[?#].*$", "")
                      if string.find(path, "/api/", 1, true) ~= nil then
                        return false
                      end
                      return string.find(string.match(path, "[^/]*$"), ".", 1, true) == nil
                    end

                    function envoy_on_request(request_handle)
                      local headers = request_handle:headers()
                      if is_page(headers) then
                        headers:remove("accept-encoding")
                      end
                    end

                    function envoy_on_response(response_handle)
                      local headers = response_handle:headers()
                      local content_type = headers:get("content-type")
                      if content_type == nil or string.find(content_type, "text/html", 1, true) == nil then
                        return
                      end
                      -- Compressed anyway (a request the filter did not take for a page): leave it alone.
                      if headers:get("content-encoding") ~= nil then
                        return
                      end
                      local body = response_handle:body()
                      if body == nil then
                        return
                      end
                      local html = body:getBytes(0, body:length())
                      local _, head_end = string.find(html, "<head>", 1, true)
                      if head_end == nil then
                        return
                      end
                      local length = body:setBytes(string.sub(html, 1, head_end) .. SCRIPT .. string.sub(html, head_end + 1))
                      -- Reading the body ends the first headers handle's scope: take a new one.
                      response_handle:headers():replace("content-length", tostring(length))
                    end
  # The chart's NetworkPolicies isolate ingress for its pods. Prometheus (namespace monitoring) also needs the
  # sidecar's ports, or Kiali gets no traffic for argocd: 15020 merged metrics and health, 15090 Envoy's own. Nothing
  # here is egress-isolated, so the sidecars reach DNS, istiod and Valkey.
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: istio-sidecars
      namespace: argocd
    spec:
      podSelector: {}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
          ports:
            - {port: 15020, protocol: TCP}
            - {port: 15090, protocol: TCP}
