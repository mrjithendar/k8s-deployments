# Installed by minikube-infrastructure/embeddings.tf (release bge-m3, namespace embeddings). README.md beside this file.

# Image reference only, kept here (not in templates/) so Dependabot's helm updater can bump it. Pinned by the
# multi-arch index digest; mk4's nodes are arm64 (Hetzner cax21). The arm64 image is about 2.9 GB compressed.
image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592

model:
  # What callers send as "model". bge-m3:567m is the F16 build (1.16 GB): dense vectors only, 1024 dimensions.
  name: bge-m3:567m
  # sha256 of the weights layer (application/vnd.ollama.image.model) of registry.ollama.ai/library/bge-m3:567m,
  # checked after every download, so a re-pushed tag fails the pod instead of quietly serving different vectors.
  # Changing the model changes every vector: seo-agent and moks must reindex (README.md, "Changing the model").
  digest: sha256:daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c

ollama:
  # Tokens per input. Callers chunk to about 350-480 tokens (seo-agent embeddings.py, moks rag_chunk_tokens); 2048
  # leaves room for code, whose tokens run longer than the 4-characters estimate, and bounds the compute buffers.
  # A longer input is truncated, not refused.
  contextLength: 2048
  # Requests computed at once. moks sends batches of 32 texts per request; more parallelism only adds memory on 4 cores.
  numParallel: 2

# One replica on CPU. Memory: the 1.16 GB of weights stay loaded (keep-alive forever) plus compute buffers.
# No CPU limit on purpose: the runner sizes its thread pool to the node's cores, and a CFS quota below that thread
# count stalls it on every batch. Under contention the request decides its share.
resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 2560Mi

# The downloaded model. A Hetzner volume (not local-path) so the pod can start on any node without downloading again.
storage:
  className: hcloud-volumes
  size: 5Gi  # Hetzner's minimum; the model uses 1.2 GB

# Who may call port 11434. Each entry is let through by the NetworkPolicy (namespace, plus podLabels when given) and
# by the AuthorizationPolicy (the mTLS identity of serviceAccount). Everything else is refused.
callers:
  - namespace: jithendar          # seo-agent (jithendar.com kubernetes/seo-agent-40-seo-agent.yaml)
    serviceAccount: default
    podLabels:
      app: seo-agent
  - namespace: moks-sre           # moks-api, moks-worker, moks-crewai (moks-sre deploy/helm/moks)
    serviceAccount: moks
    podLabels:
      app: moks
