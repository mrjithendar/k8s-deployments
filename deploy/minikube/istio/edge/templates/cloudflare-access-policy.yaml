{{- with .Values.cloudflare.access }}{{ if .enabled }}
{{- $team := required "cloudflare.access.teamDomain is required (<team>.cloudflareaccess.com)" .teamDomain }}
{{- /* A prefix in cloudflare.public is open to everyone behind Cloudflare's human check instead (cloudflare-public.yaml). */}}
{{- $paths := list }}{{ range .prefixes }}{{ if not (has . $.Values.cloudflare.public) }}{{ $paths = append $paths . }}{{ $paths = append $paths (printf "%s/*" .) }}{{ end }}{{ end }}
{{- $except := list }}{{ range .except }}{{ $except = append $except . }}{{ $except = append $except (printf "%s/*" .) }}{{ end }}
# The paths behind Cloudflare Access refuse a request without a valid Access token (templates/cloudflare-access.yaml
# checks the token; this denies its absence).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: cloudflare-access
  namespace: {{ $.Release.Namespace | quote }}
spec:
  selector:
    matchLabels: {{ toYaml $.Values.selector | nindent 6 }}
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: [{{ printf "https://%s/*" $team | quote }}]
      to:
        - operation:
            paths: {{ toJson $paths }}
            {{- with $except }}
            notPaths: {{ toJson . }}
            {{- end }}
      when:
        # Keeps this HTTP rule off the TLS (TCP) hosts (see templates/_helpers.tpl).
        - key: connection.sni
          notValues: {{ include "edge.tlsSnis" $ }}
{{- end }}{{ end }}
