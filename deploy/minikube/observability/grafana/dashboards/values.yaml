# Grafana's file provider mounts these ConfigMaps read-only (../values.yaml: dashboardsConfigMaps) and picks up changes
# within 30 s, without a restart.
# {file name: JSON} of the Jithendar.com dashboards; minikube-infrastructure/grafana.tf fills it from the jithendar.com
# checkout's grafana/ folder.
jithendar: {}

# What anonymous visitors see in the Grafana org "Public" (var.grafana_public, docs/grafana-public.md): one folder per
# key, from ConfigMap grafana-dashboards-public-<key> (templates/grafana-dashboards-public-*-configmap.yaml). Each file
# is a copy of the one in that folder above (jithendar: from .Values.jithendar). Only dashboards whose every query goes
# to Prometheus: the Public org has no Loki or Jaeger data source, because logs and traces carry visitor addresses
# (tests/test_grafana_public.py checks it). Listed by name, so a new dashboard stays private until it is added here.
# Off (no ConfigMaps) until Terraform sets enabled.
public:
  enabled: false
  folders:
    jithendar:
      title: Jithendar.com
      dashboards:
        - jithendar-com-news.json
        - jithendar-com-overview.json
        - jithendar-com-seo-agent.json
    moks:
      title: MOKS
      dashboards:
        - moks-knowledge.json
        - moks-llm.json
        - moks-ml.json
        - moks-platform.json
    platform:
      title: Platform
      dashboards:
        - platform-embeddings.json
        - platform-github-runner-pods.json
        - platform-github-runners.json
        - platform-istio-control-plane.json
        - platform-istio-mesh.json
        - platform-postgres.json
        - platform-redis.json
    roboshop:
      title: RoboShop
      dashboards:
        - roboshop-kubernetes.json
        - roboshop-observability.json
        - roboshop-services.json
