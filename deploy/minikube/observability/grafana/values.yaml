# Pinned grafana-community chart; TLS terminates at the Istio gateway.
fullnameOverride: grafana
replicas: 1
deploymentStrategy:
  type: Recreate
service:
  type: ClusterIP
  port: 80
persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi
  accessModes: [ReadWriteOnce]
  annotations:
    # terraform destroy and helm uninstall leave the volume and its data.
    helm.sh/resource-policy: keep
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
# Also Prometheus's login on the Istio gateway (edge values.yaml, basicAuth); created by credentials.py.
admin:
  existingSecret: monitoring-auth
  userKey: username
  passwordKey: password
# Routed by the Istio gateway: delegate VirtualService monitoring/grafana, rendered by the edge chart
# (istio/edge, addonRoutes).
ingress:
  enabled: false
# Nothing strips /grafana on the way in: Grafana handles the prefix itself.
grafana.ini:
  server:
    domain: jithendar.com
    root_url: https://jithendar.com/grafana/
    serve_from_sub_path: true
    protocol: http
  security:
    cookie_secure: true
    cookie_samesite: lax
  users:
    allow_sign_up: false
  # The landing page from mrjithendar/monitoring (dashboards/public/live-infrastructure.json), for anyone with no home
  # dashboard of their own or of their org. Until the first deploy writes it, Home shows an error.
  dashboards:
    default_home_dashboard_path: /tmp/dashboards/public/live-infrastructure.json
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_updates: false
  # Jaeger 2.x serves only /api/v3. With this toggle the Jaeger data source uses it for trace-by-id, services and
  # operations; its Search and dependency graph still call the removed /api/* and fail (dashboards find traces
  # through Loki's trace_id instead). Experimental in Grafana 13.2.
  feature_toggles:
    enable: jaegerEnableGrpcEndpoint
readinessProbe:
  httpGet:
    path: /grafana/api/health
    port: grafana
livenessProbe:
  httpGet:
    path: /grafana/api/health
    port: grafana

# Grafana queries Prometheus inside the cluster; ingress authentication is external only.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: roboshop-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090/prometheus
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
      - name: Loki
        uid: roboshop-loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          # Log lines carry trace_id=<32 hex>. TraceID opens the trace in Grafana (Jaeger data source below);
          # TraceID (Jaeger UI) opens Jaeger's own UI, which is not public: kubectl -n observability
          # port-forward svc/jaeger 16686 first.
          derivedFields:
            - name: TraceID
              matcherRegex: "trace_id=([0-9a-f]{32})"
              datasourceUid: jaeger
              url: "$${__value.raw}"  # the query for the Jaeger data source; $$ escapes Grafana's env-var expansion
              urlDisplayLabel: "View trace"
            - name: TraceID (Jaeger UI)
              matcherRegex: "trace_id=([0-9a-f]{32})"
              url: "http://localhost:16686/trace/$${__value.raw}"
              urlDisplayLabel: "Open in Jaeger UI (port-forward)"
      # Traces from the OpenTelemetry collector (services jithendar-com, moks-worker). Needs the
      # jaegerEnableGrpcEndpoint toggle above; no NetworkPolicy in observability, so Grafana reaches it directly.
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.observability.svc.cluster.local:16686
        isDefault: false
        editable: false
        jsonData:
          nodeGraph:
            enabled: true
          # Span → log lines of the same trace. Every app that logs trace_id writes it as trace_id=<hex>.
          tracesToLogsV2:
            datasourceUid: roboshop-loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            customQuery: true
            query: '{namespace=~"jithendar|moks-sre"} |= "trace_id=$${__trace.traceId}"'

# Dashboards: every one lives in mrjithendar/monitoring, whose deploy workflow applies one ConfigMap per dashboard to
# namespace grafana-dashboards (label grafana_dashboard=1, annotation grafana_folder=<org>/<Folder>). The sidecar
# below writes each to /tmp/dashboards/<org>/<Folder>/<uid>.json; one file provider per org loads its directory, with
# a Grafana folder per subdirectory. A file the sidecar removes (its ConfigMap deleted) removes the dashboard.
sidecar:
  # Gatekeeper's requiredResources constraint wants a memory limit on every container.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    # Our providers below (one per org) instead of the chart's single one.
    SCProvider: false
    label: grafana_dashboard
    labelValue: "1"
    # Only there: Grafana may read ConfigMaps in that namespace and nowhere else (grafana.tf, not the chart's
    # cluster-wide role; rbac.create below).
    searchNamespace: grafana-dashboards
    resource: configmap
    folder: /tmp/dashboards
    folderAnnotation: grafana_folder
    # The providers poll every 30 s. The reload API would need the admin password, which Grafana does not take from
    # monitoring-auth after its first start.
    skipReload: true

# The chart's ClusterRole would let Grafana (now open to anyone, read-only) list Secrets and ConfigMaps cluster-wide
# once a sidecar is on. grafana.tf grants it read on ConfigMaps in grafana-dashboards only.
rbac:
  create: false

# orgId 1 is the main org. While var.grafana_public is set, grafana.tf moves "public" to the org "Public".
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: public
        orgId: 1
        type: file
        disableDeletion: false
        editable: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /tmp/dashboards/public
          foldersFromFilesStructure: true
      - name: private
        orgId: 1
        type: file
        disableDeletion: false
        editable: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /tmp/dashboards/private
          foldersFromFilesStructure: true

# No node pin: the local-path volume keeps the pod on the node that holds its data.
nodeSelector: {}
