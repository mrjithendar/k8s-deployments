groups:
  - name: observability
    rules:
      - alert: ObservabilityTargetDown
        expr: up{job=~"loki|alloy|otel-collector|jaeger|tempo"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} is not responding; logs or traces may not be collected'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/observability/README.md#runbooks'
      # Alloy gives up on a batch after its retries (seen 2026-11-02: Loki answered "Ingester is shutting down").
      - alert: LogShippingDropped
        expr: sum(increase(loki_write_dropped_entries_total{job="alloy"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Alloy dropped {{ $value | humanize }} log lines in 15 min; they are lost'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/observability/README.md#runbooks'
      # One rate() per counter, told apart by `reason`: refused and failed have identical labels, so a single
      # rate() over both answered "vector cannot contain metrics with the same labelset" and this rule never ran
      # (seen in Prometheus → Rules on 2026-11-04).
      - alert: TraceSpansLost
        expr: >-
          sum by (job, reason) (
            label_replace(rate({__name__=~"otelcol_receiver_refused_spans(_total)?", job=~"otel-collector|jaeger"}[10m]), "reason", "refused", "", "")
            or label_replace(rate({__name__=~"otelcol_receiver_failed_spans(_total)?", job=~"otel-collector|jaeger"}[10m]), "reason", "failed", "", "")
            or label_replace(rate({__name__=~"otelcol_exporter_send_failed_spans(_total)?", job=~"otel-collector|jaeger"}[10m]), "reason", "send_failed", "", "")
          ) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} is losing spans ({{ $labels.reason }})'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/observability/README.md#runbooks'
      # Jaeger keeps traces in memory; an OOM kill loses all of them.
      - alert: JaegerMemoryNearLimit
        expr: max(container_memory_working_set_bytes{namespace="observability", container="jaeger"}) / max(container_spec_memory_limit_bytes{namespace="observability", container="jaeger"} > 0) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Jaeger uses {{ $value | humanizePercentage }} of its memory limit and may be OOM-killed'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/observability/README.md#runbooks'
      # Tempo (while var.tempo is set) writes a block to R2 about every 30 s. A failed write is retried; meanwhile the
      # block waits on Tempo's volume, so nothing is lost unless the volume fills or goes away.
      - alert: TempoBlocksNotStored
        expr: sum(increase(tempo_live_store_failed_completions_total{job="tempo"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Tempo failed to write {{ $value | humanize }} trace blocks to R2 in 15 min; they wait on its volume'
          description: 'kubectl -n observability logs statefulset/tempo -c tempo | grep -i -E "complete|s3|r2". Usual causes: the R2 token (Secret tempo-r2) revoked or rotated, the bucket deleted.'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/deploy/minikube/observability/tempo/README.md#checks'
      # Spans Tempo refused: its per-tenant limits (rate, trace size, live traces). They are lost.
      - alert: TempoSpansDiscarded
        expr: sum by (reason) (increase(tempo_discarded_spans_total{job="tempo"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Tempo discarded {{ $value | humanize }} spans in 15 min ({{ $labels.reason }}); they are lost'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/deploy/minikube/observability/tempo/README.md#checks'
      - alert: TempoMemoryNearLimit
        expr: max(container_memory_working_set_bytes{namespace="observability", container="tempo"}) / max(container_spec_memory_limit_bytes{namespace="observability", container="tempo"} > 0) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Tempo uses {{ $value | humanizePercentage }} of its memory limit and may be OOM-killed (its volume keeps what was not written yet)'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/deploy/minikube/observability/tempo/README.md#checks'
  # Health probes (/api/health) are excluded: they were about half of all requests and diluted both ratios.
  - name: jithendar-com
    rules:
      - alert: JithendarComDown
        expr: up{job="jithendar-com"} == 0 or absent(up{job="jithendar-com"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'jithendar.com pod {{ $labels.instance }} is not answering metrics scrapes'
          runbook_url: 'https://github.com/moks-tech/jithendar.com/blob/master/www/docs/OBSERVABILITY.md#site-down'
      # At least 3 failures in the window, so a single 5xx at night does not page as "100 %".
      - alert: JithendarComHighErrorRatio
        expr: |
          (
            sum(rate(http_server_requests_total{job="jithendar-com", route!="/api/health", status="5xx"}[5m]))
              / sum(rate(http_server_requests_total{job="jithendar-com", route!="/api/health"}[5m]))
          ) > 0.05
          and sum(increase(http_server_requests_total{job="jithendar-com", route!="/api/health", status="5xx"}[5m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $value | humanizePercentage }} of jithendar.com requests fail with 5xx'
          runbook_url: 'https://github.com/moks-tech/jithendar.com/blob/master/www/docs/OBSERVABILITY.md#5xx-errors'
      - alert: JithendarComSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="jithendar-com", route!~"other|/api/health"}[10m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'jithendar.com p95 response time is {{ $value | humanizeDuration }}'
          runbook_url: 'https://github.com/moks-tech/jithendar.com/blob/master/www/docs/OBSERVABILITY.md#slow-responses'
  # MOKS's own health: the portal, its agent runs and the dependencies they use. Not the clusters MOKS investigates.
  - name: moks
    rules:
      - alert: MoksMetricsDown
        expr: up{job="moks"} == 0 or absent(up{job="moks"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'MOKS pod {{ $labels.instance }} is not answering metrics scrapes (or no MOKS pod is found)'
      - alert: MoksApiErrors
        expr: sum(rate(moks_http_requests_total{job="moks", status=~"5.."}[10m])) / sum(rate(moks_http_requests_total{job="moks"}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'More than 5% of MOKS API requests fail with 5xx'
          description: 'Loki: {namespace="moks-sre"} | logfmt | event="http_request" | status=~"5.." gives trace ids to open in Jaeger.'
      - alert: MoksModelCallsFailing
        expr: sum by (provider) (rate(moks_llm_requests_total{job="moks", outcome!="ok"}[15m])) / sum by (provider) (rate(moks_llm_requests_total{job="moks"}[15m])) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Over half of {{ $labels.provider }} model calls fail; investigations fall back to rule-based reports'
          description: 'The outcome label is the failure kind (auth, timeout, rate_limited, unavailable, budget, refused, bad_response).'
      - alert: MoksInvestigationsFailing
        expr: sum(increase(moks_investigations_total{job="moks", outcome="failed"}[1h])) >= 3 and sum(increase(moks_investigations_total{job="moks", outcome="failed"}[1h])) / sum(increase(moks_investigations_total{job="moks"}[1h])) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'More than 30% of MOKS investigations failed in the last hour'
      - alert: MoksToolCallsFailing
        expr: sum by (tool) (rate(moks_tool_calls_total{job="moks", outcome!~"ok|invalid_args"}[15m])) / sum by (tool) (rate(moks_tool_calls_total{job="moks"}[15m])) > 0.5 and sum by (tool) (increase(moks_tool_calls_total{job="moks"}[15m])) >= 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'MOKS tool {{ $labels.tool }} fails more than half the time; check its connector'
      - alert: MoksJobsWaiting
        expr: max by (job_class) (moks_jobs_oldest_age_seconds{job="moks"}) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'A due {{ $labels.job_class }} job has waited over 15 minutes; check the moks-worker pod'
  # Copied from moks-sre deploy/grafana/moks-alerts.yaml. Every MOKS process exports these gauges and only a worker sets
  # them, so each rule takes max() over the job: one alert, not one per pod (both backup alerts fired six times on mk4).
  - name: moks-durability
    rules:
      - alert: MoksBackupOverdue
        expr: time() - max(moks_backup_last_success_timestamp_seconds{job="moks"}) > 10800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No successful MOKS backup for over 3 hours
          description: Also fires when no backup has ever succeeded (mk4 has no moks-backup CronJob yet).
      - alert: MoksBackupFailed
        expr: max(moks_backup_last_run_success{job="moks"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The latest MOKS backup run failed
      - alert: MoksDatabaseVolumeFilling
        expr: max(moks_database_size_bytes{job="moks"}) / max(moks_database_volume_bytes{job="moks"}) > 0.7
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: The MOKS database has used over 70% of its volume
  - name: moks-search
    rules:
      # MOKS searches PostgreSQL (rag.backend postgres) since 2026-11-19. The moks_search_backend probe, its outbox
      # and their alerts belong to an external search cluster (OpenSearch), which mk4 no longer runs.
      - alert: MoksRetrievalFallingBack
        expr: sum by (reason) (rate(moks_retrieval_fallbacks_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Knowledge searches are answered with less than was asked for: {{ $labels.reason }}'
  # About MOKS's own ML (shadow mode), never about the workloads it watches. Copied from moks-sre deploy/grafana/moks-alerts.yaml.
  - name: moks-ml
    rules:
      - alert: MoksMLModelInvalid
        expr: increase(moks_ml_fallbacks_total{job="moks", capability="anomaly_detection", reason="model_invalid"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An anomaly model failed its artifact checks and is not scoring
          description: Checksum, format, schema or structure. Roll the cohort back or retrain it (moks-sre docs/ML.md, Roll back).
      - alert: MoksMLChampionNeedsReview
        expr: max by (algorithm, reason) (moks_ml_model_degraded{job="moks"}) == 1
        for: 2h
        labels:
          severity: info
        annotations:
          summary: An anomaly champion's health check recommends a review
          description: Flag rate above its gate, input drift, judged precision below 0.7, or a stale schema. MOKS Settings > Machine learning > Models shows which and why.
      - alert: MoksMLContextUnreadable
        expr: sum by (source) (increase(moks_ml_context_gaps_total{job="moks"}[1h])) > 10
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Correlation keeps failing to read context from one source
          description: Groups still form, with fewer links. Check the connector and the automation principal's bindings.
  - name: redis
    rules:
      # Shared Valkey (deploy/minikube/redis): one primary for every application.
      - alert: ValkeyDown
        expr: up{job="redis"} == 0 or redis_up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Valkey pod {{ $labels.pod }} ({{ $labels.instance }}) is down; if it was the primary, writes fail until a replica takes over'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/minikube-infrastructure/README.md#redis-valkey'
      - alert: ValkeyReplicaMissing
        expr: max(redis_connected_slaves{job="redis"}) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'The Valkey primary has {{ $value }} of 1 replica connected'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/minikube-infrastructure/README.md#redis-valkey'
      # maxmemory-policy volatile-lru: past maxmemory with only TTL-less keys left, writes fail with OOM.
      - alert: ValkeyMemoryHigh
        expr: max(redis_memory_used_bytes{job="redis"} / (redis_memory_max_bytes{job="redis"} > 0)) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Valkey uses {{ $value | humanizePercentage }} of maxmemory; writes are refused at 100%'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/minikube-infrastructure/README.md#redis-valkey'
      - alert: ValkeyEvictingKeys
        expr: sum(increase(redis_evicted_keys_total{job="redis"}[15m])) > 0
        labels:
          severity: info
        annotations:
          summary: 'Valkey evicted {{ $value | humanize }} TTL keys in 15 min (memory pressure)'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/minikube-infrastructure/README.md#redis-valkey'
  # bge-m3 embeddings in namespace rag (deployed by mrjithendar/moks-rag; runbook docs/bge-m3-monitoring.md) for the RAG
  # API, seo-agent and moks. Ollama exports no metrics: requests
  # come from bge-m3's own sidecar (reporter="destination", which outlives caller restarts) plus the callers' sidecars
  # for requests that never reached the pod (flags UH, UF, UO, NR); the rest from cAdvisor.
  # Dashboard: Platform / Embeddings (bge-m3).
  - name: embeddings
    rules:
      - alert: BgeM3NotRunning
        expr: absent(container_memory_working_set_bytes{job="kubernetes-cadvisor", namespace="rag", container="ollama"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'The bge-m3 ollama container has not been running for 10 min; seo-agent and moks cannot embed'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/docs/bge-m3-monitoring.md#monitoring'
      # Resident memory under 1 GiB: the 1.16 GB of weights are not in memory, so the next request pays a cold load.
      - alert: BgeM3ModelNotLoaded
        expr: max(container_memory_rss{job="kubernetes-cadvisor", namespace="rag", container="ollama"}) < 1073741824
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'bge-m3 holds {{ $value | humanize1024 }}B resident, so the model is not loaded'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/docs/bge-m3-monitoring.md#monitoring'
      # At least 3 in the window, so one cancelled request does not page. A code a caller has not had before starts a
      # new series already at N, which increase() reads as 0; the `unless ... offset 15m` terms add that N.
      - alert: BgeM3RequestsFailing
        expr: |
          sum by (source_workload_namespace, source_workload, response_code) (
              increase(istio_requests_total{job="envoy-stats", reporter="destination", destination_service_namespace="rag", destination_service_name="bge-m3", response_code!~"2.."}[15m])
              + (
                min_over_time(istio_requests_total{job="envoy-stats", reporter="destination", destination_service_namespace="rag", destination_service_name="bge-m3", response_code!~"2.."}[15m])
                unless istio_requests_total{job="envoy-stats", reporter="destination", destination_service_namespace="rag", destination_service_name="bge-m3", response_code!~"2.."} offset 15m
              )
            or
              increase(istio_requests_total{job="envoy-stats", reporter="destination", destination_service_namespace="rag", destination_service_name="bge-m3", response_code!~"2.."}[15m])
            or
              increase(istio_requests_total{job="envoy-stats", reporter="source", destination_service_namespace="rag", destination_service_name="bge-m3", response_flags=~".*(UH|UF|UO|NR).*"}[15m])
              + (
                min_over_time(istio_requests_total{job="envoy-stats", reporter="source", destination_service_namespace="rag", destination_service_name="bge-m3", response_flags=~".*(UH|UF|UO|NR).*"}[15m])
                unless istio_requests_total{job="envoy-stats", reporter="source", destination_service_namespace="rag", destination_service_name="bge-m3", response_flags=~".*(UH|UF|UO|NR).*"} offset 15m
              )
            or
              increase(istio_requests_total{job="envoy-stats", reporter="source", destination_service_namespace="rag", destination_service_name="bge-m3", response_flags=~".*(UH|UF|UO|NR).*"}[15m])
          ) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.source_workload_namespace }}/{{ $labels.source_workload }} got {{ $value | humanize }} answers {{ $labels.response_code }} from bge-m3 in 15 min'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/docs/bge-m3-monitoring.md#monitoring'
      - alert: BgeM3MemoryNearLimit
        expr: max(container_memory_working_set_bytes{job="kubernetes-cadvisor", namespace="rag", container="ollama"}) / max(container_spec_memory_limit_bytes{job="kubernetes-cadvisor", namespace="rag", container="ollama"} > 0) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'bge-m3 uses {{ $value | humanizePercentage }} of its memory limit and may be OOM-killed'
          runbook_url: 'https://github.com/mrjithendar/k8s-deployments/blob/master/docs/bge-m3-monitoring.md#monitoring'
  # Istio (deploy/minikube/istio): istiod's replicas and every proxy's Envoy stats. Dashboards: Platform / Istio mesh
  # and Platform / Istio control plane.
  - name: istio
    rules:
      # The injection webhook fails closed: with no istiod, no pod in an injected namespace can be created, and proxies
      # cannot renew their 24 h certificates.
      - alert: IstiodDown
        expr: sum(up{job="istiod"}) == 0 or absent(up{job="istiod"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'No istiod replica answers; pods in injected namespaces cannot be created'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/istio/README.md#monitoring'
      - alert: IstiodReplicaDown
        expr: up{job="istiod"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'istiod {{ $labels.pod }} is down; the other replica serves every proxy alone'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/istio/README.md#monitoring'
      - alert: IstioProxyNotScraped
        expr: up{job="envoy-stats"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Prometheus cannot read the Envoy stats of {{ $labels.namespace }}/{{ $labels.pod }}; its traffic is missing from Kiali and Grafana'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/istio/README.md#monitoring'
      # A proxy that refuses a push (NACK) keeps running on the last configuration it accepted.
      - alert: IstioConfigRejected
        expr: sum(increase(pilot_total_xds_rejects{job="istiod"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Proxies rejected {{ $value | humanize }} configuration pushes from istiod in 15 min'
          runbook_url: 'https://github.com/moks-tech/kubernetes/blob/master/deploy/minikube/istio/README.md#monitoring'
